name: Tests

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            code:
              - "jaxgam/**"
              - "tests/**"
              - "pyproject.toml"
              - "uv.lock"
              - "Dockerfile"
              - "Makefile"
              - ".github/workflows/test.yml"

  lint:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
      - run: uv sync --extra dev
      - run: make lint

  test-full:
    runs-on: ubuntu-latest
    needs: [changes, lint]
    if: needs.changes.outputs.code == 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: jaxgam-test:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Run tests with coverage
        run: make test-cov-ci DOCKER_TAG=ci
      - name: Upload to Codecov
        uses: codecov/codecov-action@v5
        with:
          files: coverage/coverage.xml
          token: ${{ secrets.CODECOV_TOKEN }}

  test-gaussian:
    runs-on: ubuntu-latest
    needs: [changes, lint]
    if: needs.changes.outputs.code == 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: jaxgam-test:ci
          cache-from: type=gha
      - name: Trace native Gaussian GP convergence
        run: make test-gaussian-ci DOCKER_TAG=ci

  # Platform-sensitive tests sampled on eight runners: one full-suite run lands
  # on a single random x86_64 runner type (with or without AVX-512), so a
  # CPU-dependent failure can pass there. Eight replicas make sampling both
  # types likely, not certain. Each replica's pytest header prints its CPU
  # model and AVX-512 flags. Part of the gate.
  test-platform-sensitive:
    runs-on: ubuntu-latest
    needs: [changes, lint]
    if: needs.changes.outputs.code == 'true'
    strategy:
      fail-fast: false
      matrix:
        replica: [1, 2, 3, 4, 5, 6, 7, 8]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: jaxgam-test:ci
          cache-from: type=gha
      - name: Run platform-sensitive tests (replica ${{ matrix.replica }})
        run: make test-platform-sensitive-ci DOCKER_TAG=ci

  test-efs-recovery:
    runs-on: ubuntu-latest
    needs: [changes, lint]
    if: needs.changes.outputs.code == 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: jaxgam-test:ci
          cache-from: type=gha
      - name: Trace native EFS retained-start recovery
        run: make test-efs-recovery-ci DOCKER_TAG=ci

  test-nb-public:
    runs-on: ubuntu-latest
    needs: [changes, lint]
    if: needs.changes.outputs.code == 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: jaxgam-test:ci
          cache-from: type=gha
      - name: Verify native public NB theta convergence
        run: make test-nb-public-ci DOCKER_TAG=ci

  test-regular-public:
    runs-on: ubuntu-latest
    needs: [changes, lint]
    if: needs.changes.outputs.code == 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: jaxgam-test:ci
          cache-from: type=gha
      - name: Verify native public regular links and Gamma arithmetic
        run: make test-regular-public-ci DOCKER_TAG=ci

  gate:
    if: always()
    needs: [lint, test-full, test-gaussian, test-platform-sensitive, test-efs-recovery, test-nb-public, test-regular-public]
    runs-on: ubuntu-latest
    steps:
      - run: |
          if [[ "${{ contains(needs.*.result, 'failure') }}" == "true" || "${{ contains(needs.*.result, 'cancelled') }}" == "true" ]]; then
            echo "One or more jobs failed or were cancelled"
            exit 1
          fi
