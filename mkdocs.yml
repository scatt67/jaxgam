site_name: jaxgam
site_description: Python port of R's mgcv package for Generalized Additive Models
repo_url: https://github.com/scatt67/jaxgam
repo_name: scatt67/jaxgam

theme:
  name: material
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          options:
            show_source: false
            show_root_heading: true
            show_root_full_path: false
            members_order: source
            docstring_style: numpy
            merge_init_into_class: true
            show_signature_annotations: true

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        # Render ```mermaid blocks as diagrams (flow and UML diagrams in the
        # architecture pages).
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true
  - tables
  - toc:
      permalink: true

nav:
  - Home: index.md
  - Quickstart: quickstart.md
  - User guide:
      - Choosing a route: guide/choosing_a_route.md
      - Smoothing parameter selection: guide/smoothing_selection.md
      - Row sources: guide/row_sources.md
      - Streamed fitting: guide/streamed.md
      - Discretized fitting: guide/discretized.md
      - Operator fitting: guide/operator.md
      - Prediction results: guide/prediction_results.md
      - Memory and performance: guide/memory_and_performance.md
  - API Reference: api.md
  - Architecture:
      - Overview: architecture/index.md
      - Lifecycle of a fit: architecture/fit_lifecycle.md
      - Model setup: architecture/setup.md
      - Row sources and discretization: architecture/data_sources.md
      - The dense fit: architecture/fitting_dense.md
      - The streamed fit: architecture/fitting_streamed.md
      - The discretized fit: architecture/fitting_discrete.md
      - The operator fit: architecture/fitting_operator.md
      - Results and prediction: architecture/results_and_prediction.md
      - Families, links and smooths: architecture/families_links_smooths.md
      - Testing and CI: architecture/testing_and_ci.md
      - Numerics and platform: architecture/numerics_and_platform.md
  - Citations: citations.md
