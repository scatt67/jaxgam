[project]
name = "jaxgam"
version = "1.0.0a1"
description = "Python port of R's mgcv package for Generalized Additive Models"
license = "GPL-2.0-or-later"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.24",
    "scipy>=1.11",
    # Two pinned OpenBLAS wheels, both loaded RTLD_LOCAL by
    # jaxgam/smooths/source_lapack.py; neither replaces NumPy/SciPy's BLAS.
    # - scipy-openblas32 (OpenBLAS 0.3.26, LP64): cubic-shrinkage DSYEVR and
    #   DGEMM, getFS DPTSV, and the source penalty-coordinate DSYEVR. It
    #   matches the OpenBLAS 0.3.26 linked by pinned Linux R 4.5.2/mgcv 1.9-3.
    # - scipy-openblas64 (OpenBLAS 0.3.30, ILP64): only the source Rlanczos
    #   DSYEVD/DGEMV/DGEMM/DDOT/DNRM2 used by Gaussian-process bases.
    # A single wheel was measured on 2026-10-24 and rejected:
    # - openblas64 for everything: on pinned Linux the cubic-shrinkage raw
    #   penalties miss pinned R (worst case max abs 0.393, rel 0.156, a
    #   null-space orientation change), and the coupled-alias rank gauge
    #   misses (max abs 0.141 / 0.512 / 0.458).
    # - openblas32 for everything: on macOS the weighted GP rank map flips
    #   gauge against pinned R (coefficients max abs 8.30, covariance 1.26e4),
    #   where the two-wheel configuration passes.
    "scipy-openblas32==0.3.26.0.4",
    "scipy-openblas64==0.3.30.0.2",
    "numba>=0.58",
    "jax>=0.4.20",
    "jaxlib>=0.4.20",
    "matplotlib>=3.7",
    "pandas>=2.0",
]

[project.optional-dependencies]
dev = [
    "cloudpickle",
    "pytest>=7.0",
    "pytest-xdist",
    "pytest-cov",
    "pre-commit",
    "ruff",
    "vulture",
]
r = [
    "rpy2>=3.5",
]

docs = [
    "mkdocs-material>=9.0",
    "mkdocstrings[python]>=0.24",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "W", "I", "ARG", "B", "UP", "SIM", "C4", "RUF", "T20", "PERF", "NPY", "PT", "PIE"]

[tool.ruff.lint.per-file-ignores]
# R bridge contains embedded R scripts in f-strings with long lines
"tests/r_bridge.py" = ["E501"]
# Scripts are not library code — print, unused vars, etc. are fine
"scripts/**" = ["T201", "RUF059"]

[tool.vulture]
paths = ["jaxgam"]
min_confidence = 80

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
]

[tool.coverage.run]
source = ["jaxgam"]

[tool.coverage.report]
fail_under = 80
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if __name__ == .__main__.",
]
